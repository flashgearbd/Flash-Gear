<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FLASH GEAR BD — Product Manager</title>
<style>
:root{--blue:#087fff;--blue2:#18aaff;--ink:#102235;--muted:#708398;--bg:#f4f7fa;--card:#fff;--line:#dfe8ef;--ok:#0d9f63;--danger:#d83c52}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.brand{display:flex;align-items:center;gap:12px;margin:4px 0 18px}.brand-mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));display:grid;place-items:center;color:white;font-weight:900;font-size:20px}.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0 0;color:var(--muted);font-size:11px}.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:20px;box-shadow:0 12px 35px rgba(25,55,85,.07);margin-bottom:14px}.title{font-size:17px;margin:0 0 4px}.sub{color:var(--muted);font-size:12px;margin:0 0 17px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.field{margin-bottom:12px}.field.full{grid-column:1/-1}label{display:block;font-size:11px;font-weight:800;margin:0 0 6px;color:#42566b}input,select,textarea{width:100%;border:1px solid var(--line);border-radius:15px;background:#fbfdff;padding:13px 14px;outline:none;color:var(--ink);font-size:14px}input:focus,select:focus,textarea:focus{border-color:#75bfff;box-shadow:0 0 0 3px rgba(8,127,255,.08)}textarea{min-height:100px;resize:vertical}.upload{border:2px dashed #b9d7ed;background:#f7fbff;border-radius:19px;padding:17px;text-align:center;cursor:pointer}.upload input{display:none}.upload strong{display:block;color:var(--blue);font-size:13px}.upload span{display:block;color:var(--muted);font-size:11px;margin-top:4px}.preview{margin-top:12px;border-radius:17px;overflow:hidden;background:#eef4f8;display:none;position:relative}.preview img{width:100%;max-height:300px;object-fit:contain;display:block}.checks{display:flex;gap:10px;flex-wrap:wrap}.check{display:flex;align-items:center;gap:8px;background:#f4f8fb;border:1px solid var(--line);border-radius:999px;padding:9px 12px;font-size:12px;font-weight:700}.check input{width:auto}.btn{width:100%;border:0;border-radius:999px;padding:15px;background:linear-gradient(135deg,var(--blue),var(--blue2));color:#fff;font-weight:900;font-size:14px;box-shadow:0 10px 24px rgba(8,127,255,.2)}.btn:disabled{opacity:.55}.status{display:none;border-radius:15px;padding:13px;margin-top:12px;font-size:12px;font-weight:700}.status.ok{display:block;background:#eafaf3;color:var(--ok);border:1px solid #bcebd5}.status.err{display:block;background:#fff0f2;color:var(--danger);border:1px solid #f1c0c9}.pin-note{font-size:10px;color:#8a9bad;margin-top:8px}.success-id{font-family:ui-monospace,monospace}.hide{display:none}@media(max-width:560px){.grid{grid-template-columns:1fr}.field.full{grid-column:auto}.wrap{padding:12px}.card{padding:16px;border-radius:21px}}
</style></head><body>
<div class="wrap">
  <div class="brand"><div class="brand-mark">FG</div><div><h1>FLASH GEAR BD</h1><p>Mobile Product Manager</p></div></div>
  <form id="form" class="card">
    <h2 class="title">Add New Product</h2><p class="sub">Upload a photo from your phone and save everything directly to your Products sheet.</p>
    <div class="grid">
      <div class="field"><label>Product Name *</label><input id="name" required placeholder="Baseus Power Bank 20,000mAh"></div>
      <div class="field"><label>Brand</label><input id="brand" placeholder="Baseus"></div>
      <div class="field"><label>Category *</label><select id="category"><option>Mobile Phones</option><option>Feature Phone</option><option>Adapter & Cable</option><option>Charger</option><option>Earbud</option><option>Headphone</option><option>Neckband</option><option>Earphone</option><option>Speaker</option><option>Powerbank</option><option>Smart watch</option><option>Tripod</option><option>Boya</option><option>Screen Protector</option><option>Phone Case</option></select></div>
      <div class="field"><label>Stock</label><select id="stock"><option>In Stock</option><option>Out of Stock</option><option>Pre-Order</option></select></div>
      <div class="field"><label>Price (৳) *</label><input id="price" type="number" min="0" inputmode="decimal" required placeholder="2500"></div>
      <div class="field"><label>MRP (৳)</label><input id="mrp" type="number" min="0" inputmode="decimal" placeholder="3000"></div>
      <div class="field"><label>Warranty</label><input id="warranty" placeholder="6 Months"></div>
      <div class="field"><label>Product ID (optional)</label><input id="id" placeholder="Auto generated"></div>
      <div class="field full"><label>Product Image</label><label class="upload"><input id="image" type="file" accept="image/*"><strong>＋ Choose product image</strong><span>Recommended: clear square photo. It will be optimized before upload.</span></label><div id="preview" class="preview"><img id="previewImg" alt="Preview"></div></div>
      <div class="field full"><label>Description</label><textarea id="description" placeholder="Short product description, key features, compatibility, etc."></textarea></div>
      <div class="field full"><div class="checks"><label class="check"><input id="featured" type="checkbox"> Featured product</label><label class="check"><input id="active" type="checkbox" checked> Publish on website</label></div></div>
      <div class="field full"><label>Manager PIN *</label><input id="pin" type="password" inputmode="numeric" placeholder="Enter your PIN" required><div class="pin-note">Keep this page and PIN private.</div></div>
      <div class="field full"><button id="submit" class="btn" type="submit">Save Product →</button><div id="status" class="status"></div></div>
    </div>
  </form>
</div>
<script>
const $=id=>document.getElementById(id);let imageData='',imageName='';
$('image').addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;imageName=file.name;$('previewImg').src=URL.createObjectURL(file);$('preview').style.display='block';try{imageData=await resizeImage(file)}catch(err){imageData='';alert('Could not process this image. Try another photo.')}});
function resizeImage(file){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>{const max=1400;let w=img.naturalWidth,h=img.naturalHeight;if(Math.max(w,h)>max){const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r)}const c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(img,0,0,w,h);resolve(c.toDataURL('image/webp',.88))};img.onerror=reject;img.src=URL.createObjectURL(file)})}
$('form').addEventListener('submit',e=>{e.preventDefault();const btn=$('submit'),status=$('status');btn.disabled=true;btn.textContent='Saving product…';status.className='status';status.style.display='none';const data={id:$('id').value,name:$('name').value,brand:$('brand').value,category:$('category').value,stock:$('stock').value,price:$('price').value,mrp:$('mrp').value,warranty:$('warranty').value,description:$('description').value,featured:$('featured').checked,active:$('active').checked,pin:$('pin').value,imageData,imageName};google.script.run.withSuccessHandler(r=>{status.className='status ok';status.innerHTML='✓ Product saved. ID: <span class="success-id">'+r.id+'</span>';status.style.display='block';$('form').reset();$('active').checked=true;$('preview').style.display='none';imageData='';btn.disabled=false;btn.textContent='Save Product →'}).withFailureHandler(err=>{status.className='status err';status.textContent='✕ '+(err.message||'Could not save product.');status.style.display='block';btn.disabled=false;btn.textContent='Save Product →'}).saveProduct(data)});
</script></body></html>
