<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>FLASH GEAR BD — Product Manager</title>
<style>
:root{--blue:#087fff;--cyan:#18cfff;--ink:#102235;--muted:#708398;--bg:#f4f7fa;--card:#fff;--line:#dfe8ef;--ok:#0d9f63;--danger:#d83c52}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}
.wrap{max-width:760px;margin:auto;padding:14px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.mark{width:46px;height:46px;border-radius:15px;background:linear-gradient(135deg,var(--blue),var(--cyan));display:grid;place-items:center;color:#fff;font-weight:900}
.brand h1{font-size:19px;margin:0}.brand p{margin:3px 0;color:var(--muted);font-size:11px}
.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:17px;margin-bottom:12px;box-shadow:0 10px 30px rgba(25,55,85,.06)}
.title{font-size:16px;margin:0 0 4px}.sub{font-size:12px;color:var(--muted);margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}
label{display:block;font-size:11px;font-weight:800;color:#42566b;margin-bottom:6px}
input,select,textarea{width:100%;border:1px solid var(--line);border-radius:14px;background:#fbfdff;padding:12px;font-size:14px;color:var(--ink);outline:none}
input:focus,select:focus,textarea:focus{border-color:#75bfff;box-shadow:0 0 0 3px rgba(8,127,255,.08)}
textarea{min-height:90px}.row{display:flex;gap:9px}.row>*{flex:1}
.btn{border:0;border-radius:999px;padding:13px 16px;font-weight:900;font-size:13px;cursor:pointer}
.primary{background:linear-gradient(135deg,var(--blue),var(--cyan));color:#fff}.ghost{background:#edf5fb;color:#17405d}
.danger{background:#fff0f2;color:var(--danger)}
.status{display:none;border-radius:14px;padding:11px;margin-top:10px;font-size:12px;font-weight:700}
.ok{display:block;background:#eafaf3;color:var(--ok);border:1px solid #bcebd5}.err{display:block;background:#fff0f2;color:var(--danger);border:1px solid #f1c0c9}
.searchbox{display:flex;gap:8px}.searchbox input{flex:1}.searchbox button{width:52px}
.preview{display:none;margin-top:10px;border-radius:15px;overflow:hidden;background:#eef4f8;text-align:center}.preview img{max-width:100%;max-height:260px;display:block;margin:auto}
.upload{border:2px dashed #b9d7ed;background:#f7fbff;border-radius:16px;padding:14px;text-align:center;cursor:pointer}
.upload input{display:none}.upload strong{color:var(--blue);font-size:13px}.upload span{display:block;color:var(--muted);font-size:10px;margin-top:3px}
.hint{font-size:10px;color:#8293a3;margin-top:5px}
@media(max-width:560px){.grid{grid-template-columns:1fr}.full{grid-column:auto}.row{flex-direction:column}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><div class="mark">FG</div><div><h1>FLASH GEAR BD</h1><p>Mobile Product Manager</p></div></div>

  <div class="card">
    <h2 class="title">Find Product</h2>
    <p class="sub">Search by Product ID or product name. Load it, edit it, then save.</p>
    <div class="searchbox">
      <input id="search" placeholder="Product ID or name">
      <button class="btn primary" id="find">Search</button>
    </div>
    <label style="display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px"><input id="includeInactive" type="checkbox" style="width:auto"> Include inactive products (PIN required)</label>
    <div id="searchStatus" class="status"></div>
  </div>

  <form id="form" class="card">
    <h2 class="title">Add / Edit Product</h2>
    <p class="sub">Leave Product ID empty to create a new ID automatically.</p>

    <div class="grid">
      <div class="full">
        <label>Product ID</label>
        <input id="id" placeholder="FG-0001">
      </div>

      <div>
        <label>Product Name *</label>
        <input id="name" required>
      </div>

      <div>
        <label>Brand</label>
        <input id="brand">
      </div>

      <div>
        <label>Category *</label>
        <select id="category">
          <option>Mobile Phones</option><option>Feature Phone</option>
          <option>Adapter & Cable</option><option>Charger</option>
          <option>Earbud</option><option>Headphone</option><option>Neckband</option>
          <option>Earphone</option><option>Speaker</option><option>Powerbank</option>
          <option>Smart watch</option><option>Tripod</option><option>Boya</option>
          <option>Screen Protector</option><option>Phone Case</option><option>Other</option>
        </select>
      </div>

      <div>
        <label>Status</label>
        <select id="active">
          <option value="true">Active — Publish</option>
          <option value="false">Inactive — Hide</option>
        </select>
      </div>

      <div>
        <label>RP / Selling Price (৳) *</label>
        <input id="price" type="number" min="0" inputmode="decimal" required>
      </div>

      <div>
        <label>MRP (৳)</label>
        <input id="mrp" type="number" min="0" inputmode="decimal">
      </div>

      <div>
        <label>Stock Quantity</label>
        <input id="stock" type="number" min="0" step="1" inputmode="numeric">
      </div>

      <div class="full">
        <label>Product Images</label>
        <div class="grid">
          <label class="upload"><input id="image" type="file" accept="image/*"><strong>＋ Main Image</strong><span>Google Drive</span></label>
          <label class="upload"><input id="image2" type="file" accept="image/*"><strong>＋ Image 2</strong><span>Optional</span></label>
          <label class="upload"><input id="image3" type="file" accept="image/*"><strong>＋ Image 3</strong><span>Optional</span></label>
        </div>
        <div id="preview" class="preview"><img id="previewImg" alt="Product preview"></div>
        <div class="hint">Images are uploaded to the FLASH GEAR BD Google Drive product folder.</div>
      </div>

      <div>
        <label>Warranty</label>
        <input id="warranty" placeholder="Example: 6 Months">
      </div>
      <div>
        <label>Colour</label>
        <input id="color" placeholder="Example: Black">
      </div>
      <div>
        <label>Featured</label>
        <select id="featured"><option value="false">No</option><option value="true">Yes — Featured</option></select>
      </div>
      <div class="full">
        <label>Description</label>
        <textarea id="description"></textarea>
      </div>

      <div class="full">
        <label>Manager PIN *</label>
        <input id="pin" type="password" inputmode="numeric" autocomplete="off" required>
        <div class="hint">Keep your PIN private.</div>
      </div>

      <div class="full row">
        <button class="btn primary" id="save" type="submit">Save Product</button>
        <button class="btn ghost" id="clear" type="button">Clear</button>
      </div>

      <div class="full">
        <div id="status" class="status"></div>
      </div>
    </div>
  </form>
</div>

<script>
const $=id=>document.getElementById(id);
let imageData='', imageData2='', imageData3='';

function showStatus(el,msg,type){
  el.className='status '+type;
  el.textContent=msg;
}

function readFile(file){
  return new Promise((resolve,reject)=>{
    const img=new Image();
    img.onload=()=>{
      const max=1400;
      let w=img.naturalWidth,h=img.naturalHeight;
      if(Math.max(w,h)>max){
        const r=max/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);
      }
      const c=document.createElement('canvas');
      c.width=w;c.height=h;
      const x=c.getContext('2d');
      x.drawImage(img,0,0,w,h);
      resolve(c.toDataURL('image/webp',.86));
      URL.revokeObjectURL(img.src);
    };
    img.onerror=reject;
    img.src=URL.createObjectURL(file);
  });
}

async function bindImageInput(id,key){$(id).addEventListener('change',async e=>{const file=e.target.files[0];if(!file)return;try{const data=await readFile(file);if(key===1)imageData=data;if(key===2)imageData2=data;if(key===3)imageData3=data;if(key===1){$('previewImg').src=data;$('preview').style.display='block';}}catch(err){if(key===1)imageData='';if(key===2)imageData2='';if(key===3)imageData3='';alert('Could not process this image.');}})}
bindImageInput('image',1);bindImageInput('image2',2);bindImageInput('image3',3);

function fill(p){
  if(!p){
    showStatus($('searchStatus'),'Product not found.','err');
    return;
  }
  $('id').value=p.id||'';
  $('name').value=p.name||'';
  $('brand').value=p.brand||'';
  $('category').value=p.category||'Other';
  $('price').value=p.price??'';
  $('mrp').value=p.mrp??'';
  $('stock').value=p.stock??0;
  $('description').value=p.description||'';
  $('warranty').value=p.warranty||'';
  $('color').value=p.color||'';
  $('featured').value=String(p.featured)==='true'?'true':'false';
  $('active').value=(String(p.status||'Active').toLowerCase()==='inactive')?'false':'true';
  imageData='';
  $('preview').style.display='none';
  $('image').value='';
  showStatus($('searchStatus'),'Product loaded. You can edit and save it.','ok');
  window.scrollTo({top:$('form').offsetTop-8,behavior:'smooth'});
}

$('find').addEventListener('click',async()=>{
  const q=$('search').value.trim();
  if(!q)return;
  if($('includeInactive').checked && !$('pin').value.trim()){showStatus($('searchStatus'),'Enter the Manager PIN to include inactive products.','err');return;}
  $('find').disabled=true;
  showStatus($('searchStatus'),'Searching…','ok');
  try{
    const r=await new Promise((resolve,reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).searchProducts(q,$('includeInactive').checked?$('pin').value:'');
    });
    if(r && r.length) fill(r[0]);
    else showStatus($('searchStatus'),'No matching product found.','err');
  }catch(err){
    showStatus($('searchStatus'),err.message||'Search failed.','err');
  }finally{$('find').disabled=false;}
});

$('search').addEventListener('keydown',e=>{
  if(e.key==='Enter'){e.preventDefault();$('find').click();}
});

$('form').addEventListener('submit',async e=>{
  e.preventDefault();
  const btn=$('save');
  btn.disabled=true;
  btn.textContent='Saving…';
  $('status').className='status';
  $('status').style.display='none';

  const data={
    id:$('id').value.trim(),
    name:$('name').value.trim(),
    brand:$('brand').value.trim(),
    category:$('category').value,
    price:$('price').value,
    mrp:$('mrp').value,
    stock:$('stock').value,
    description:$('description').value,
    warranty:$('warranty').value,
    color:$('color').value,
    featured:$('featured').value==='true',
    active:$('active').value==='true',
    pin:$('pin').value,
    imageData:imageData,
    imageData2:imageData2,
    imageData3:imageData3
  };

  try{
    const r=await new Promise((resolve,reject)=>{
      google.script.run.withSuccessHandler(resolve).withFailureHandler(reject).saveProduct(data);
    });
    showStatus($('status'),'✓ '+(r.updated?'Product updated. ':'Product saved. ')+'ID: '+r.id,'ok');
    $('id').value=r.id;
    imageData=''; imageData2=''; imageData3='';
    $('image').value='';$('image2').value='';$('image3').value='';
    $('preview').style.display='none';
  }catch(err){
    showStatus($('status'),'✕ '+(err.message||'Could not save product.'),'err');
  }finally{
    btn.disabled=false;
    btn.textContent='Save Product';
  }
});

$('clear').addEventListener('click',()=>{
  $('form').reset();
  $('active').value='true';
  imageData=''; imageData2=''; imageData3='';
  $('image').value='';$('image2').value='';$('image3').value='';
  $('preview').style.display='none';
  $('status').className='status';
  $('status').style.display='none';
});
</script>
</body>
</html>
